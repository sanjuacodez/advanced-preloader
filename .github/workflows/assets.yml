name: Update WordPress.org assets

# Pushes .wordpress-org/ (icons, banners, screenshots) to the SVN assets folder
# without a new release. Code changes still go out through deploy.yml and a tag.
# Note: the action also syncs readme.txt to trunk and the stable tag, so keep
# readme.txt in step with the released version when pushing asset changes.
on:
  push:
    branches:
      - main
    paths:
      - '.wordpress-org/**'
  workflow_dispatch:

jobs:
  assets:
    name: Push assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update assets on WordPress.org
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: advanced-preloader
          IGNORE_OTHER_FILES: true
